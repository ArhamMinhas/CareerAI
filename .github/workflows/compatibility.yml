name: Compatibility Matrix

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 only: app/schemas/envelope.py's `class Envelope[T]` uses PEP 695 generic syntax,
        # a hard SyntaxError on 3.11 — not a bug to work around, this project's actual minimum
        # supported version (see pyproject.toml's mypy python_version and the api/worker
        # Dockerfiles, both already pinned to 3.12).
        python-version: ['3.12']
      fail-fast: false
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careerai
          POSTGRES_PASSWORD: careerai
          POSTGRES_DB: careerai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerai -d careerai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://careerai:careerai@localhost:5432/careerai
      DATABASE_URL_SYNC: postgresql://careerai:careerai@localhost:5432/careerai
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SECRET_KEY: ci-test-secret
      SUPABASE_JWT_SECRET: ci-test-jwt-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Enable pgvector extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=careerai psql -h localhost -U careerai -d careerai -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: alembic upgrade head

      - name: Test
        run: pytest -v

  node-matrix:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test web
        run: npm run test:web

      - name: Build web
        run: npm run build:web
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
