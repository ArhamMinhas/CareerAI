name: Deploy

# Phase 16 scaffolding: no real Vercel/Railway deploy targets are configured yet, so this only
# runs on an explicit manual dispatch. It used to also fire automatically via `workflow_run` on
# every successful CI run on master, which created a real GitHub Deployment record each time and
# then always failed the smoke-test step (https://staging.careerai.app doesn't exist yet) —
# showing up as a permanent red "failed" deployment on the repo's homepage. Re-add the
# `workflow_run` trigger once real deploy credentials/targets exist.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_WEB: ${{ github.repository }}/web
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_WORKER: ${{ github.repository }}/worker

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.careerai.app
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image tags
        id: tags
        run: |
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "ref=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')" >> $GITHUB_OUTPUT

      - name: Deploy web to Vercel
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Deploying web to Vercel staging...');
            // Use Vercel's deploy webhook or CLI
            // Example: call Vercel API to trigger deployment
            // For now, this is a placeholder — configure your Vercel deployment token and project ID

      - name: Deploy api/worker to Railway/ECS
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENVIRONMENT: staging
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ steps.tags.outputs.sha }}
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ steps.tags.outputs.sha }}
        run: |
          # Example for Railway.app deployment:
          # railway up --service api --image ${{ env.API_IMAGE }}
          # railway up --service worker --image ${{ env.WORKER_IMAGE }}
          echo "Deploying to staging..."
          echo "API Image: ${{ env.API_IMAGE }}"
          echo "Worker Image: ${{ env.WORKER_IMAGE }}"

      - name: Run smoke tests
        run: |
          # Poll the staging API until it's healthy
          max_attempts=30
          attempt=0
          until [ $attempt -ge $max_attempts ] || curl -f https://staging.careerai.app/api/v1/health; do
            attempt=$((attempt + 1))
            echo "Waiting for staging deployment... (attempt $attempt/$max_attempts)"
            sleep 10
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Staging deployment health check failed"
            exit 1
          fi
          echo "Staging deployment is healthy"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://careerai.app
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image tags
        id: tags
        run: |
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "ref=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')" >> $GITHUB_OUTPUT

      - name: Deploy web to Vercel (production)
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Deploying web to Vercel production...');
            // Use Vercel's production deploy webhook
            // Example: call Vercel API with production flag

      - name: Deploy api/worker to Railway/ECS (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENVIRONMENT: production
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ steps.tags.outputs.sha }}
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ steps.tags.outputs.sha }}
        run: |
          echo "Deploying to production..."
          echo "API Image: ${{ env.API_IMAGE }}"
          echo "Worker Image: ${{ env.WORKER_IMAGE }}"

      - name: Run production smoke tests
        run: |
          # Poll the production API until it's healthy
          max_attempts=30
          attempt=0
          until [ $attempt -ge $max_attempts ] || curl -f https://careerai.app/api/v1/health; do
            attempt=$((attempt + 1))
            echo "Waiting for production deployment... (attempt $attempt/$max_attempts)"
            sleep 10
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Production deployment health check failed"
            exit 1
          fi
          echo "Production deployment is healthy"

      - name: Notify deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // This job's trigger (workflow_dispatch) has no associated pull request, so
            // there's no issue to comment on here — just log the outcome.
            const status = context.job.status === 'success' ? '✅ Success' : '❌ Failed';
            console.log(`Production deployment ${status}`);
