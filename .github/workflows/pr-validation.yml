name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  checks: read

jobs:
  pr-validation:
    name: Pull Request Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const validPrefixes = ['feat:', 'fix:', 'docs:', 'refactor:', 'test:', 'chore:', 'perf:', 'ci:'];
            const isValid = validPrefixes.some(prefix => title.toLowerCase().startsWith(prefix));
            
            if (!isValid) {
              core.setFailed(`PR title must start with one of: ${validPrefixes.join(', ')}`);
            } else {
              console.log(`✓ PR title format valid: "${title}"`);
            }

      - name: Check for changelog entry
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const hasChangelog = files.some(f => 
              f.filename === 'CHANGELOG.md' || f.filename.includes('CHANGELOG')
            );
            
            if (!hasChangelog && files.some(f => f.filename.startsWith('apps/') || f.filename.startsWith('packages/'))) {
              core.warning('Consider adding a CHANGELOG entry for this change');
            }

      - name: Check for breaking changes
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body || '';
            
            if (title.includes('BREAKING') || body.includes('BREAKING')) {
              console.log('⚠️  This PR introduces breaking changes');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '🚨 **Breaking Changes Detected**\n\nThis PR introduces breaking changes. Please ensure:\n- Migration guide is documented\n- Dependent services are updated\n- Release notes are prepared'
              });
            }

      - name: Check for tests in code changes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const codeFiles = files.filter(f => 
              (f.filename.startsWith('apps/api/app/') && f.filename.endsWith('.py')) ||
              (f.filename.startsWith('apps/web/') && (f.filename.endsWith('.ts') || f.filename.endsWith('.tsx')))
            );
            
            const testFiles = files.filter(f => 
              f.filename.includes('test') || f.filename.includes('spec')
            );
            
            if (codeFiles.length > 0 && testFiles.length === 0) {
              core.warning(`Code changes detected (${codeFiles.length} files) but no test changes found`);
            }

      - name: Label PR by area
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const labels = new Set();
            
            for (const file of files) {
              if (file.filename.startsWith('apps/web/')) labels.add('area:web');
              if (file.filename.startsWith('apps/api/')) labels.add('area:api');
              if (file.filename.startsWith('infrastructure/')) labels.add('area:infra');
              if (file.filename.startsWith('docs/')) labels.add('area:docs');
              if (file.filename.includes('test')) labels.add('type:test');
            }
            
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels),
              });
            }

      - name: Check file size limits
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const MAX_SIZE = 500000; // 500KB
            const largeFiles = files.filter(f => f.additions + f.deletions > MAX_SIZE);
            
            if (largeFiles.length > 0) {
              core.warning(`Large file changes detected:\n${largeFiles.map(f => `- ${f.filename}`).join('\n')}`);
            }

      - name: Require reviews
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            // This is informational; actual branch protection rules are configured in GitHub UI
            const reviews = pullRequest.review_comments;
            console.log(`Current reviews: ${pullRequest.requested_reviewers.length} reviewers requested`);

  ci-status-check:
    name: Wait for CI Status
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    steps:
      - name: Check required status checks
        uses: actions/github-script@v7
        with:
          script: |
            console.log('ℹ️  This PR requires passing checks before merge:');
            console.log('- CI (web, api, security)');
            console.log('- Compatibility matrix (Python 3.11, 3.12; Node 20, 22)');
            console.log('- All status checks must be green');

  dependabot-auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge for Dependabot PRs
        uses: actions/github-script@v7
        with:
          script: |
            // Automatically merge minor/patch updates
            // Major version updates require manual review
            const title = context.payload.pull_request.title;
            
            if (title.includes('patch') || title.includes('minor')) {
              github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'squash',
              });
              console.log('✓ Auto-merged Dependabot patch/minor update');
            } else {
              console.log('⚠️  Major version update requires manual review');
            }
